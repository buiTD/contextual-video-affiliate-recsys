name: Keep-alive & Regression

# Public repo: scheduled workflows are free. Pings keep HF Spaces / Supabase awake.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: curl -fsS --max-time 60 "${{ secrets.BACKEND_HEALTH_URL }}" || true
      - name: Ping Supabase REST
        run: |
          curl -fsS --max-time 30 "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" || true