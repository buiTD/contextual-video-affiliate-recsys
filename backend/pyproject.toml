[project]
name = "contextual-video-affiliate-recsys-backend"
version = "1.0.0"
description = "Zero-LLM serving contextual short-video affiliate recommender (FastAPI + pgvector)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "supabase>=2.6",
    "pyjwt[crypto]>=2.8",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "google-genai>=1.0",
]

# Heavy ML / evaluation deps — install with: uv sync --extra ml
[project.optional-dependencies]
ml = [
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"